# Runs the external build comparison suite: builds a sample of
# conda-forge feedstock recipes with `whl2conda build` using the runner's
# toolchain and semantically compares the results against the
# corresponding conda-forge packages (see doc/guide/building.md).
#
# Runs on demand only. It also runs on pull requests that modify this
# workflow file, so changes are validated by an actual run.
name: build-compare

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/build-compare.yml"

jobs:
  build-compare:
    name: build-compare (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v3
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          pixi-version: v0.69.0
          cache: true
          environments: compare
      - name: Run build comparison suite
        run: pixi run build-compare
      - name: Upload comparison report
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-compare-report-${{ matrix.os }}
          path: |
            build-compare-report.md
            build-compare-report.json
